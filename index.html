<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marchward</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1b1f24; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      #topbar {
        position: fixed; top: 12px; left: 12px; right: 336px; padding: 6px 10px;
        font: 13px/1.5 system-ui, sans-serif; color: #e8e2d0;
        background: rgba(20, 22, 26, 0.85); border-radius: 6px;
      }
      .top-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
      .top-row strong { min-width: 150px; }
      .season { padding: 0 6px; border-radius: 3px; font-size: 12px; }
      .season.spring { background: #3d5a32; } .season.summer { background: #6b5a24; }
      .season.autumn { background: #6b3f22; } .season.winter { background: #3c4f66; }
      .stores { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 2px; }
      #readout {
        position: fixed; left: 12px; bottom: 12px; min-width: 220px; max-width: 340px; padding: 10px 12px;
        font: 13px/1.5 system-ui, sans-serif; color: #e8e2d0;
        background: rgba(20, 22, 26, 0.85); border-radius: 6px; pointer-events: none;
      }
      #readout strong, #panel strong { font-size: 14px; margin-top: 4px; }
      .dim, #help { color: #a39d8c; }
      .good { color: #9fd98b; }
      .bad { color: #f08a72; }
      .warn { color: #f0c56a; }
      #tools {
        position: fixed; top: 84px; left: 12px; padding: 8px; max-width: 360px;
        font: 13px/1.5 system-ui, sans-serif; color: #e8e2d0;
        background: rgba(20, 22, 26, 0.85); border-radius: 6px;
      }
      .tool-row { display: flex; flex-wrap: wrap; gap: 4px; }
      .option-row { display: flex; align-items: center; gap: 4px; margin-top: 6px; }
      .option-row span { width: 72px; color: #a39d8c; }
      #tools button, #panel button, #topbar button {
        font: 12px system-ui, sans-serif; color: #e8e2d0; background: #2c3138;
        border: 1px solid #454c55; border-radius: 4px; padding: 4px 8px; cursor: pointer;
      }
      #tools button:hover, #panel button:hover, #topbar button:hover { background: #3a414a; }
      #tools button.active, #panel button.active, #topbar button.active { background: #7a5c2e; border-color: #c8a060; }
      #panel {
        position: fixed; top: 12px; right: 12px; width: 300px; max-height: calc(100% - 160px); overflow-y: auto;
        padding: 10px 12px; font: 13px/1.5 system-ui, sans-serif; color: #e8e2d0;
        background: rgba(20, 22, 26, 0.85); border-radius: 6px;
      }
      .tab-row { display: flex; gap: 3px; margin: -2px 0 8px; flex-wrap: wrap; }
      .tab-row button { margin-top: 0 !important; }
      #panel strong { display: block; }
      .hire-row { display: grid; grid-template-columns: 82px 52px 26px 26px 30px 1fr; gap: 3px; align-items: center; margin-top: 4px; }
      .hire-row button { margin-top: 0 !important; padding: 2px 4px !important; }
      .hire-note { font-size: 11px; line-height: 1.3; margin: 0 0 3px; }
      .hire-wage { text-align: right; }
      .shop-row { display: flex; flex-wrap: wrap; gap: 4px; }
      .shop-row button { margin-top: 4px !important; }
      .levy { display: block; margin: 4px 0; cursor: pointer; }
      .bar { height: 8px; background: #2c3138; border-radius: 4px; overflow: hidden; margin: 4px 0; }
      .bar-fill { height: 100%; background: #c8a060; }
      .trade-table { display: grid; grid-template-columns: 70px 112px 1fr; white-space: nowrap; gap: 0 8px; }
      .job { margin-top: 4px; font-size: 12px; line-height: 1.35; }
      .head-gap { margin-top: 4px; }
      .graph { margin-top: 6px; }
      .graph-title { font-size: 12px; }
      .log { font-size: 12px; line-height: 1.35; margin-top: 3px; }
      #panel section + section { margin-top: 10px; padding-top: 8px; border-top: 1px solid #3a3f46; }
      #panel button { margin-top: 8px; }
      .alert { margin-top: 2px; font-weight: 600; }
      .alert:empty { display: none; }
      #report {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100% - 40px));
        max-height: calc(100% - 120px); overflow-y: auto; padding: 14px 18px; z-index: 5;
        font: 13px/1.5 system-ui, sans-serif; color: #e8e2d0;
        background: rgba(20, 22, 26, 0.96); border: 1px solid #7a5c2e; border-radius: 8px;
      }
      #report h2 { margin: 0 0 4px; font-size: 17px; }
      .report-head { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
      #report section { margin-top: 8px; padding-top: 6px; border-top: 1px solid #3a3f46; }
      #report strong { display: block; font-size: 14px; }
      #report button {
        margin-top: 10px; font: 12px system-ui, sans-serif; color: #e8e2d0; background: #2c3138;
        border: 1px solid #454c55; border-radius: 4px; padding: 4px 10px; cursor: pointer;
      }
      #help {
        position: fixed; right: 12px; bottom: 12px; padding: 8px 12px;
        font: 12px/1.6 system-ui, sans-serif; text-align: right;
        background: rgba(20, 22, 26, 0.8); border-radius: 6px; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="topbar"></div>
    <div id="tools"></div>
    <div id="panel"></div>
    <div id="readout"></div>
    <div id="report"></div>
    <div id="help">
      Space pauses or starts the clock · V shows the land as planned<br />
      Right-drag, or WASD / arrow keys, to move<br />
      Mouse wheel or + / − to zoom<br />
      1–9, 0 pick a tool · R turns the gatehouse · Esc cancels<br />
      C to recentre · G to show the grid · T top-down view on or off
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
