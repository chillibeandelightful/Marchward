<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marchward</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1b1f24; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      #hud {
        position: fixed; top: 12px; left: 12px; padding: 8px 12px;
        font: 13px/1.5 system-ui, sans-serif; color: #e8e2d0;
        background: rgba(20, 22, 26, 0.8); border-radius: 6px; pointer-events: none;
      }
      #readout {
        position: fixed; left: 12px; bottom: 12px; min-width: 220px; max-width: 340px; padding: 10px 12px;
        font: 13px/1.5 system-ui, sans-serif; color: #e8e2d0;
        background: rgba(20, 22, 26, 0.85); border-radius: 6px; pointer-events: none;
      }
      #readout strong, #panel strong { font-size: 14px; margin-top: 4px; }
      .dim, #help { color: #a39d8c; }
      .good { color: #9fd98b; }
      .bad { color: #f08a72; }
      .warn { color: #f0c56a; }
      #tools {
        position: fixed; top: 52px; left: 12px; padding: 8px; max-width: 360px;
        font: 13px/1.5 system-ui, sans-serif; color: #e8e2d0;
        background: rgba(20, 22, 26, 0.85); border-radius: 6px;
      }
      .tool-row { display: flex; flex-wrap: wrap; gap: 4px; }
      .option-row { display: flex; align-items: center; gap: 4px; margin-top: 6px; }
      .option-row span { width: 72px; color: #a39d8c; }
      #tools button, #panel button {
        font: 12px system-ui, sans-serif; color: #e8e2d0; background: #2c3138;
        border: 1px solid #454c55; border-radius: 4px; padding: 4px 8px; cursor: pointer;
      }
      #tools button:hover, #panel button:hover { background: #3a414a; }
      #tools button.active, #panel button.active { background: #7a5c2e; border-color: #c8a060; }
      #panel {
        position: fixed; top: 12px; right: 12px; width: 300px; max-height: calc(100% - 120px); overflow-y: auto;
        padding: 10px 12px; font: 13px/1.5 system-ui, sans-serif; color: #e8e2d0;
        background: rgba(20, 22, 26, 0.85); border-radius: 6px;
      }
      #panel section + section { margin-top: 10px; padding-top: 8px; border-top: 1px solid #3a3f46; }
      #panel button { margin-top: 8px; }
      #help {
        position: fixed; right: 12px; bottom: 12px; padding: 8px 12px;
        font: 12px/1.6 system-ui, sans-serif; text-align: right;
        background: rgba(20, 22, 26, 0.8); border-radius: 6px; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="tools"></div>
    <div id="panel"></div>
    <div id="readout"></div>
    <div id="help">
      Right-drag, or WASD / arrow keys, to move<br />
      Mouse wheel or + / − to zoom<br />
      1–8 pick a tool · R turns the gatehouse · Esc cancels<br />
      C to recentre · G to show the grid
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
